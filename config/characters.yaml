# The recurring cast (from the pilot plan). Heritage details must be designed WITH
# consultants from each community before designs are locked.
#
# gemini_voice / gemini_style: used when voice.provider is "gemini" (free). Styles are
#           delivery notes only; have reviewers check any accent sounds natural, not put on.
# voice_id: ElevenLabs voice ID. Use your cast's voices (human actors, or clones made
#           with their WRITTEN consent). Leave blank until cast; mock mode needs none.
# images:   put rendered poses in assets/characters/<Name>/<pose>.png
#           (transparent PNGs from the 2D rig). "default.png" is the fallback pose.
# color:    used for placeholder cards until artwork exists.

Narrator:
  gemini_voice: Sulafat
  gemini_style: "warm, friendly storyteller, calm pace"
  voice_id: ""
  color: "#1f6f5c"
  role: "Warm storyteller voice; frames the episode."
  voice_settings: { stability: 0.55, similarity_boost: 0.75, style: 0.2 }

