# The recurring cast (from the pilot plan). Heritage details must be designed WITH
# consultants from each community before designs are locked.
#
# voice_id: ElevenLabs voice ID. Use your cast's voices (human actors, or clones made
#           with their WRITTEN consent). Leave blank until cast; mock mode needs none.
# images:   put rendered poses in assets/characters/<Name>/<pose>.png
#           (transparent PNGs from the 2D rig). "default.png" is the fallback pose.
# color:    used for placeholder cards until artwork exists.

Narrator:
  voice_id: ""
  color: "#1f6f5c"
  role: "Warm storyteller voice; frames the episode."
  voice_settings: { stability: 0.55, similarity_boost: 0.75, style: 0.2 }

Zawadi:
  voice_id: ""
  color: "#e0782f"
  role: "8. Kenyan. Inventor; confident; impatient, skips steps. Science & engineering."
  voice_settings: { stability: 0.45, similarity_boost: 0.75, style: 0.35 }

Kito:
  voice_id: ""
  color: "#3a86c8"
  role: "6. Zawadi's cousin. Funny, curious, asks 'but WHY?'. Stands in for the viewer."
  voice_settings: { stability: 0.4, similarity_boost: 0.75, style: 0.45 }

Ada:
  voice_id: ""
  color: "#8e44ad"
  role: "8. Nigerian (Igbo) family in Nairobi. Storyteller, loves languages; a bit bossy."
  voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.3 }

Tesfa:
  voice_id: ""
  color: "#2e8b57"
  role: "9. Ethiopian-Kenyan. Calm, notices patterns, loves numbers; shy."
  voice_settings: { stability: 0.6, similarity_boost: 0.75, style: 0.15 }

"Cucu Njeri":
  voice_id: ""
  color: "#b5651d"
  role: "Zawadi's grandmother (Kikuyu). Warm, witty keeper of stories — always attributes them."
  voice_settings: { stability: 0.65, similarity_boost: 0.8, style: 0.2 }

Mjusi:
  voice_id: ""
  color: "#6b8e23"
